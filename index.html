<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="O0bhtNPA69iS7ykS3kBcWlcZECqZmTavfmtIj5uTno4" />
    <title>Marcel Assogba — Portfolio</title>
    <link rel="icon" type="image/png" href="img/favicon.png?v=3" sizes="any">
    <link rel="shortcut icon" type="image/png" href="img/favicon.png?v=3">
    <link rel="apple-touch-icon" href="img/favicon.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #07070f;
            --surface: #0f0f1a;
            --purple: #7c3aed;
            --purple-light: #a78bfa;
            --cyan: #06b6d4;
            --pink: #ec4899;
            --text: #f1f5f9;
            --muted: #64748b;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(124,58,237,.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,58,237,.06) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* Glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .35;
            pointer-events: none;
            animation: drift 8s ease-in-out infinite alternate;
        }
        .orb-1 { width: 500px; height: 500px; background: var(--purple); top: -150px; right: -100px; animation-delay: 0s; }
        .orb-2 { width: 350px; height: 350px; background: var(--cyan); bottom: -100px; left: -80px; animation-delay: -3s; }
        .orb-3 { width: 280px; height: 280px; background: var(--pink); bottom: 30%; right: 20%; animation-delay: -5s; }

        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(30px, -30px) scale(1.1); }
        }

        /* Card */
        .card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 3rem 2.5rem;
            background: rgba(15,15,26,.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(124,58,237,.25);
            border-radius: 28px;
            max-width: 660px;
            width: 90%;
            box-shadow: 0 40px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
            opacity: 0;
            transform-style: preserve-3d;
            transform: perspective(1100px) rotateX(0) rotateY(0);
            transition: transform .25s ease-out, box-shadow .25s ease-out;
            animation: card-in 0.9s cubic-bezier(.22,1,.36,1) .2s both;
        }
        @keyframes card-in {
            from { opacity: 0; transform: perspective(1100px) translateY(26px); }
            to   { opacity: 1; transform: perspective(1100px) translateY(0); }
        }
        /* reflet diagonal animé */
        .card::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
            background: linear-gradient(130deg, rgba(255,255,255,.10) 0%, transparent 38%);
            opacity: .8;
        }
        .card > * { position: relative; z-index: 1; transform-style: preserve-3d; }

        /* Avatar */
        .avatar-ring {
            width: 156px; height: 156px;
            margin: 0 auto 1.6rem;
            position: relative;
            transform: translateZ(40px);
        }
        /* halo coloré derrière la photo */
        .avatar-ring .halo {
            position: absolute; inset: -22px; border-radius: 50%;
            background: radial-gradient(circle, rgba(124,58,237,.45), transparent 70%);
            filter: blur(14px); z-index: 0;
        }
        /* pastille "en ligne" */
        .avatar-badge {
            position: absolute; bottom: 8px; right: 10px; z-index: 3;
            width: 26px; height: 26px; border-radius: 50%;
            background: var(--bg); display: flex; align-items: center; justify-content: center;
        }
        .avatar-badge::after {
            content: ''; width: 14px; height: 14px; border-radius: 50%;
            background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6);
            animation: ping 1.8s ease-out infinite;
        }
        @keyframes ping {
            0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
            100% { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
        }
        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--purple), var(--cyan), var(--pink), var(--purple));
            animation: spin 4s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .avatar-ring::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--purple), var(--cyan), var(--pink), var(--purple));
            animation: spin 4s linear infinite;
            filter: blur(8px);
            opacity: .6;
        }

        .avatar-ring img {
            position: relative;
            z-index: 1;
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--bg);
        }

        /* Status badge */
        .status {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: rgba(6,182,212,.1);
            border: 1px solid rgba(6,182,212,.3);
            color: var(--cyan);
            font-size: .75rem;
            font-weight: 500;
            padding: .3rem .8rem;
            border-radius: 99px;
            margin-bottom: 1.2rem;
            letter-spacing: .05em;
        }
        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; transform: scale(1); }
            50%      { opacity:.4; transform: scale(.7); }
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 700;
            background: linear-gradient(135deg, #f1f5f9 0%, var(--purple-light) 50%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: .6rem;
        }

        .role {
            color: var(--muted);
            font-weight: 400;
            margin-bottom: 2rem;
            line-height: 1.7;
        }
        .role strong { color: var(--purple-light); font-weight: 600; }
        .role-main, .role-sub { display: block; white-space: nowrap; }
        .role-main { font-size: .92rem; margin-bottom: .25rem; }
        .role-sub { font-size: .82rem; }

        /* CTA — style "bouton de titre" (relief violet) */
        .title-button {
            --white: #ffe7ff;
            --purple-100: #f4b1fd;
            --purple-200: #d190ff;
            --purple-300: #c389f2;
            --purple-400: #8e26e2;
            --purple-500: #5e2b83;
            --radius: 25px;
            border-radius: var(--radius);
            outline: none; cursor: pointer;
            font-size: 18px;
            font-family: 'Space Grotesk', sans-serif;
            background: transparent; letter-spacing: -0.5px;
            border: 0; position: relative;
            width: 260px; height: 60px;
            transform: rotate(353deg) skewX(4deg);
            margin: 0 auto 2.4rem;
        }
        .title-button .bg { position: absolute; inset: 0; border-radius: inherit; filter: blur(1px); }
        .title-button .bg::before, .title-button .bg::after {
            content: ""; position: absolute; inset: 0;
            border-radius: calc(var(--radius) * 1.1); background: var(--purple-500);
        }
        .title-button .bg::before {
            filter: blur(5px); transition: all .3s ease;
            box-shadow: -7px 6px 0 0 rgb(115 75 155 / 40%), -14px 12px 0 0 rgb(115 75 155 / 30%),
                -21px 18px 4px 0 rgb(115 75 155 / 25%), -28px 24px 8px 0 rgb(115 75 155 / 15%),
                -35px 30px 12px 0 rgb(115 75 155 / 12%), -42px 36px 16px 0 rgb(115 75 155 / 8%),
                -56px 42px 20px 0 rgb(115 75 155 / 5%);
        }
        .title-button .wrap {
            border-radius: inherit; overflow: hidden; height: 100%;
            transform: translate(6px, -6px); padding: 3px;
            background: linear-gradient(to bottom, var(--purple-100) 0%, var(--purple-400) 100%);
            position: relative; transition: all .3s ease;
        }
        .title-button .content {
            pointer-events: none; display: flex; align-items: center; justify-content: center;
            z-index: 1; position: relative; height: 100%; gap: 10px;
            border-radius: calc(var(--radius) * 0.85); font-weight: 600; transition: all .3s ease;
            background: linear-gradient(to bottom, var(--purple-300) 0%, var(--purple-400) 100%);
            box-shadow: inset -2px 12px 11px -5px var(--purple-200), inset 1px -3px 11px 0px rgb(0 0 0 / 35%);
            color: var(--white); text-shadow: -1px 1px 2px var(--purple-500); white-space: nowrap;
        }
        .title-button:hover .wrap { transform: translate(8px, -8px); }
        .title-button:active .wrap { transform: translate(3px, -3px); }
        .title-button:active .content {
            box-shadow: inset -1px 12px 8px -5px rgba(71,0,137,.4), inset 0px -3px 8px 0px var(--purple-200);
        }

        /* Socials */
        .socials {
            display: flex;
            gap: .8rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .social-btn {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-decoration: none;
            transition: all .25s;
        }
        .social-btn svg { width: 18px; height: 18px; }
        .social-btn:hover {
            background: rgba(124,58,237,.2);
            border-color: var(--purple);
            color: var(--purple-light);
            transform: translateY(-2px);
        }

        /* Footer text */
        .footer-note {
            color: var(--muted);
            font-size: .75rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .footer-note span { color: var(--purple-light); }

        /* Floating particles */
        .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
        .p {
            position: absolute;
            width: 2px; height: 2px;
            background: rgba(167,139,250,.6);
            border-radius: 50%;
            animation: float-up var(--d, 8s) var(--delay, 0s) linear infinite;
        }
        @keyframes float-up {
            from { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            to   { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ── RESPONSIVE TABLETTE ── */
        @media (max-width: 700px) {
            body { height: auto; min-height: 100dvh; overflow-y: auto; padding: 2.5rem 0; }
            .card { padding: 2.5rem 1.6rem; transform: none !important; }
            .role-main, .role-sub { white-space: normal; }   /* on laisse respirer sur petit écran */
            .role-main { font-size: .88rem; }
            .role-sub { font-size: .82rem; }
            h1 { font-size: clamp(1.6rem, 7vw, 2.1rem); }
        }

        /* ── RESPONSIVE MOBILE ── */
        @media (max-width: 480px) {
            .card { padding: 2.1rem 1.2rem; border-radius: 22px; }
            .avatar-ring { width: 116px; height: 116px; margin-bottom: 1.2rem; }
            .avatar-badge { width: 22px; height: 22px; bottom: 6px; right: 8px; }
            .avatar-badge::after { width: 12px; height: 12px; }
            .status { font-size: .68rem; padding: .28rem .7rem; }
            h1 { font-size: 1.7rem; }
            .role-main { font-size: .8rem; }
            .role-sub { font-size: .76rem; }
            .title-button { transform: rotate(353deg) skewX(4deg) scale(.86); margin-bottom: 1.8rem; }
            .socials { gap: .6rem; }
            .social-btn { width: 42px; height: 42px; }
            .footer-note { font-size: .68rem; }
            .orb { filter: blur(60px); opacity: .28; }
        }

        /* très petits écrans */
        @media (max-width: 360px) {
            h1 { font-size: 1.5rem; }
            .title-button { transform: rotate(353deg) skewX(4deg) scale(.78); }
        }

        /* écrans bas (paysage mobile) : on autorise le scroll */
        @media (max-height: 720px) {
            body { height: auto; min-height: 100dvh; overflow-y: auto; padding: 2rem 0; }
        }
    </style>
</head>

    <script>
        const card = document.querySelector('.card');

        function enterSite() {
            card.style.animation = 'none';
            card.style.transition = 'opacity .6s, transform .6s';
            card.style.opacity = '0';
            card.style.transform = 'perspective(1100px) scale(.95) translateY(-20px)';
            setTimeout(() => { window.location.href = 'main.html'; }, 600);
        }

        // Effet 3D parallaxe au survol (désactivé sur tactile)
        let tiltOn = false;
        card.addEventListener('animationend', () => { card.style.animation = 'none'; card.style.opacity = '1'; tiltOn = true; });
        const canHover = window.matchMedia('(hover: hover)').matches;
        if (canHover) {
            card.addEventListener('mousemove', (e) => {
                if (!tiltOn) return;
                const r = card.getBoundingClientRect();
                const px = (e.clientX - r.left) / r.width - .5;
                const py = (e.clientY - r.top) / r.height - .5;
                card.style.transform = `perspective(1100px) rotateY(${px * 10}deg) rotateX(${-py * 10}deg)`;
                card.style.boxShadow = `${-px * 30}px ${py * 30 + 40}px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07)`;
            });
            card.addEventListener('mouseleave', () => {
                if (!tiltOn) return;
                card.style.transform = 'perspective(1100px) rotateX(0) rotateY(0)';
                card.style.boxShadow = '0 40px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07)';
            });
        }

        // Preload
        const l = document.createElement('link');
        l.rel = 'prefetch'; l.href = 'main.html';
        document.head.appendChild(l);
    </script>
