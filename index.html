<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marcel Assogba - Portfolio</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Critical CSS - Load immediately to prevent FOUC */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            background-color: #191a1a;
            background-image: linear-gradient(0deg, transparent 24%, rgba(114, 114, 114, 0.1) 25%, rgba(114, 114, 114, 0.1) 26%, transparent 27%,transparent 74%, rgba(114, 114, 114, 0.1) 75%, rgba(114, 114, 114, 0.1) 76%, transparent 77%,transparent),
                linear-gradient(90deg, transparent 24%, rgba(114, 114, 114, 0.1) 25%, rgba(114, 114, 114, 0.1) 26%, transparent 27%,transparent 74%, rgba(114, 114, 114, 0.1) 75%, rgba(114, 114, 114, 0.1) 76%, transparent 77%,transparent);
            background-size: 55px 55px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
        }

        body.loaded {
            visibility: visible;
        }

        .loader-container {
            text-align: center;
            color: white;
            position: relative;
            z-index: 10;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 2rem;
            border: 3px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.5s forwards;
            box-shadow: 
                0 0 20px rgba(102, 126, 234, 0.4),
                0 0 40px rgba(118, 75, 162, 0.3),
                0 0 60px rgba(240, 147, 251, 0.2),
                0 0 80px rgba(102, 126, 234, 0.1);
        }

        .welcome-title {
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 700;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.7s forwards;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: clamp(1rem, 4vw, 1.3rem);
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1s forwards;
            font-weight: 300;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 2s forwards;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .social-link svg {
            width: 24px;
            height: 24px;
        }

        .enter-btn {
            --white: #ffe7ff;
            --purple-100: #f4b1fd;
            --purple-200: #d190ff;
            --purple-300: #c389f2;
            --purple-400: #8e26e2;
            --purple-500: #5e2b83;
            --radius: 25px;

            border-radius: var(--radius);
            outline: none;
            cursor: pointer;
            font-size: 18px;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            background: transparent;
            letter-spacing: -0.5px;
            border: 0;
            position: relative;
            width: 260px;
            height: 60px;
            transform: rotate(300deg) skewX(10deg);
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.5s forwards;
        }

        .enter-btn .bg {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            filter: blur(1px);
        }

        .enter-btn .bg::before,
        .enter-btn .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: calc(var(--radius) * 1.1);
            background: var(--purple-500);
        }

        .enter-btn .bg::before {
            filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow:
                -7px 6px 0 0 rgb(115 75 155 / 40%),
                -14px 12px 0 0 rgb(115 75 155 / 30%),
                -21px 18px 4px 0 rgb(115 75 155 / 25%),
                -28px 24px 8px 0 rgb(115 75 155 / 15%),
                -35px 30px 12px 0 rgb(115 75 155 / 12%),
                -42px 36px 16px 0 rgb(115 75 155 / 8%),
                -56px 42px 20px 0 rgb(115 75 155 / 5%);
        }

        .enter-btn .wrap {
            border-radius: inherit;
            overflow: hidden;
            height: 100%;
            transform: translate(6px, -6px);
            padding: 3px;
            background: linear-gradient(
                to bottom,
                var(--purple-100) 0%,
                var(--purple-400) 100%
            );
            position: relative;
            transition: all 0.3s ease;
        }

        .enter-btn .content {
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            position: relative;
            height: 100%;
            gap: 16px;
            border-radius: calc(var(--radius) * 0.85);
            font-weight: 600;
            transition: all 0.3s ease;
            background: linear-gradient(
                to bottom,
                var(--purple-300) 0%,
                var(--purple-400) 100%
            );
            box-shadow:
                inset -2px 12px 11px -5px var(--purple-200),
                inset 1px -3px 11px 0px rgb(0 0 0 / 35%);
            color: var(--white);
            text-shadow: -1px 1px 2px var(--purple-500);
        }

        .enter-btn:hover .wrap {
            transform: translate(8px, -8px);
        }

        .enter-btn:active .bg::before {
            filter: blur(5px);
            opacity: 0.7;
            box-shadow:
                -7px 6px 0 0 rgb(115 75 155 / 40%),
                -14px 12px 0 0 rgb(115 75 155 / 25%),
                -21px 18px 4px 0 rgb(115 75 155 / 15%);
        }

        .enter-btn:active .content {
            box-shadow:
                inset -1px 12px 8px -5px rgba(71, 0, 137, 0.4),
                inset 0px -3px 8px 0px var(--purple-200);
        }

        .enter-btn:active .wrap {
            transform: translate(3px, -3px);
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 4px; height: 4px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 6px; height: 6px; left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { width: 3px; height: 3px; left: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { width: 5px; height: 5px; left: 40%; animation-delay: 0.5s; }
        .particle:nth-child(5) { width: 4px; height: 4px; left: 50%; animation-delay: 1.5s; }
        .particle:nth-child(6) { width: 6px; height: 6px; left: 60%; animation-delay: 2.5s; }
        .particle:nth-child(7) { width: 3px; height: 3px; left: 70%; animation-delay: 0.8s; }
        .particle:nth-child(8) { width: 5px; height: 5px; left: 80%; animation-delay: 1.8s; }
        .particle:nth-child(9) { width: 4px; height: 4px; left: 90%; animation-delay: 3s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8) rotate(-10deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .profile-img:hover {
            transform: scale(1.05) rotate(5deg);
            transition: all 0.3s ease;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
            50% {
                transform: translateY(-10vh) rotate(180deg);
            }
        }

        .fade-out {
            animation: fadeOut 0.8s ease-out forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.9);
            }
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 2.3s forwards;
            text-align: center;
            width: 100%;
            margin: 0 auto;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .loader-container {
                padding: 1rem;
            }
            
            .profile-img {
                width: 150px;
                height: 150px;
            }
            
            .welcome-title {
                font-size: 1.8rem;
                font-weight: 400;
            }
            
            .social-links {
                gap: 0.8rem;
            }
            
            .social-link {
                width: 45px;
                height: 45px;
            }
            
            .enter-btn {
                transform: scale(0.8) rotate(300deg) skewX(6deg);
            }
            
            .footer {
                bottom: 10px;
                font-size: 0.8rem;
            }
        }

        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            .particle {
                animation: none;
            }
            
            .logo, .subtitle, .enter-btn {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>

    <script>
        // Prevent FOUC by showing body only when fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Add small delay to ensure all styles are applied
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
        });

        function enterSite() {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = '/mon-travail';
            }, 800);
        }

        // Preload main site resources for faster transition
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = '/mon-travail';
        document.head.appendChild(link);

        // Optional: Auto-enter after 5 seconds (uncomment if desired)
        // setTimeout(enterSite, 5000);
    </script>
