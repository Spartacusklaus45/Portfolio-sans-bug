<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --page:#2b2b2b;--white:#fff;--black:#070707;--ink:#111;
  --gray:#8a8a8a;--muted:#6b6b6b;--green:#12b33f;--line:rgba(0,0,0,.09);
  --head:'Switzer','Inter',sans-serif;--body:'Inter',sans-serif;--ease:cubic-bezier(.22,1,.36,1);
}
body{
  font-family:var(--body);background:var(--page);color:var(--ink);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:16px;-webkit-font-smoothing:antialiased;
}
.card{
  position:relative;text-align:center;width:100%;max-width:520px;
  background:var(--white);border-radius:40px;padding:3.4rem 2.6rem;
  box-shadow:0 40px 90px rgba(0,0,0,.4);
  transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .25s ease-out;
  animation:card-in .9s var(--ease) .1s both;
}
@keyframes card-in{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.card>*{position:relative}

.avatar{width:120px;height:120px;margin:0 auto 1.6rem;position:relative;transform:translateZ(40px)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;
  box-shadow:0 12px 30px rgba(0,0,0,.18)}
.avatar .badge{position:absolute;bottom:6px;right:8px;width:26px;height:26px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center}
.avatar .badge::after{content:'';width:13px;height:13px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 0 rgba(18,179,63,.6);animation:ping 1.8s ease-out infinite}
@keyframes ping{100%{box-shadow:0 0 0 10px rgba(18,179,63,0)}}

.status{display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:500;
  padding:.4rem .85rem;border:1px solid var(--line);border-radius:99px;margin-bottom:1.3rem;color:#333}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}

h1{font-family:var(--head);font-weight:600;letter-spacing:-.03em;font-size:2.4rem;line-height:1;
  margin-bottom:.7rem}
.role{color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:2rem}
.role strong{color:var(--ink);font-weight:600}

.cta{display:inline-flex;align-items:center;gap:.6rem;background:var(--black);color:#fff;
  font-family:var(--body);font-weight:500;font-size:1rem;padding:.95rem 1.6rem;border-radius:99px;
  border:0;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.28);
  transition:transform .3s var(--ease),box-shadow .3s;margin-bottom:2rem}
.cta:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(0,0,0,.34)}
.cta svg{width:16px;height:16px;transition:transform .3s}
.cta:hover svg{transform:translate(3px,-3px)}

.socials{display:flex;gap:.7rem;justify-content:center}
.socials a{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:#333;transition:all .25s}
.socials a:hover{background:var(--black);color:#fff;border-color:var(--black);transform:translateY(-2px)}
.socials svg{width:17px;height:17px;fill:currentColor}

.foot{margin-top:1.8rem;font-size:.74rem;color:var(--gray)}
.foot span{color:var(--ink);font-weight:500}

@media(max-width:480px){
  .card{padding:2.6rem 1.5rem;border-radius:30px}
  .avatar{width:100px;height:100px}
  h1{font-size:2rem}
  .role{font-size:.9rem}
}
@media(max-width:360px){
  .card{padding:2.2rem 1.1rem}
  h1{font-size:1.75rem}
  .socials a{width:40px;height:40px}
}
/* écrans courts (paysage mobile) : autoriser le défilement */
@media(max-height:620px){
  body{align-items:flex-start;overflow-y:auto}
  .card{margin:14px 0}
}
</style>
</head>

<script>
document.getElementById('y').textContent=new Date().getFullYear();
const card=document.getElementById('card');
function enterSite(){
  card.style.transition='opacity .55s,transform .55s';
  card.style.opacity='0';card.style.transform='scale(.96) translateY(-16px)';
  setTimeout(()=>location.href='main.html',540);
}
/* tilt 3D (desktop) */
let ready=false;
card.addEventListener('animationend',()=>ready=true);
if(matchMedia('(hover:hover)').matches){
  card.addEventListener('mousemove',e=>{
    if(!ready)return;const r=card.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
    card.style.transform=`perspective(1100px) rotateY(${px*7}deg) rotateX(${-py*7}deg)`;
  });
  card.addEventListener('mouseleave',()=>{if(ready)card.style.transform='perspective(1100px)';});
}
const l=document.createElement('link');l.rel='prefetch';l.href='main.html';document.head.appendChild(l);
</script>
